<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanSync · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15151A">
<link rel="stylesheet" href="style.css?v=8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "6ece3179-2303-4614-a752-18378c461644",
      serviceWorkerPath: "onesignal/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/onesignal/" }
    });
  });
</script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <h1>CleanSync</h1>
    <p class="lede">Coordenação de limpezas entre cliente e profissional, sincronizada em tempo real.</p>

    <div class="tabs">
      <button id="tabBtn-login" class="active" onclick="switchTab('login')">Entrar</button>
      <button id="tabBtn-signup" onclick="switchTab('signup')">Criar conta</button>
      <button id="tabBtn-recover" onclick="switchTab('recover')">Esqueci a senha</button>
    </div>

    <!-- ENTRAR -->
    <form id="loginForm">
      <div class="field">
        <label>Usuário</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%">Entrar</button>
    </form>

    <!-- CRIAR CONTA -->
    <form id="signupForm" style="display:none">
      <div class="field">
        <label>Nome</label>
        <input type="text" id="signupName" required>
      </div>
      <div class="field">
        <label>Usuário</label>
        <input type="text" id="signupUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="signupPassword" autocomplete="new-password" required minlength="4">
      </div>
      <div class="field">
        <label>Esta conta é de</label>
        <div class="role-toggle">
          <label><input type="radio" name="signupRole" value="cliente" checked onchange="toggleSignupAddressField()"> Cliente</label>
          <label><input type="radio" name="signupRole" value="profissional" onchange="toggleSignupAddressField()"> Profissional</label>
        </div>
      </div>
      <div class="field" id="signupAddressField">
        <label>Endereço do imóvel</label>
        <input type="text" id="signupAddress" placeholder="Digite o endereço completo">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%">Criar conta</button>
    </form>

    <!-- ESQUECI A SENHA -->
    <form id="recoverForm" style="display:none">
      <div class="field">
        <label>Usuário</label>
        <input type="text" id="recoverUsername" required>
      </div>
      <div class="field">
        <label>Código de recuperação</label>
        <input type="text" id="recoverCode" placeholder="Ex: AB3D-9F2K" required>
      </div>
      <div class="field">
        <label>Nova senha</label>
        <input type="password" id="recoverNewPassword" required minlength="4">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%">Redefinir senha</button>
    </form>

    <div class="auth-note" id="authNote">
      Não existe recuperação por e-mail aqui. Ao criar a conta, você recebe um <strong>código de recuperação</strong> — anote e guarde em lugar seguro. É a única forma de trocar sua senha se esquecer.
    </div>
  </div>
</div>

<script src="app-common.js?v=8"></script>
<script>
if (!APP_CONFIGURED) renderSetupWarning();

// se já tem sessão, manda direto pra tela certa
(function initRedirect(){
  const session = getSession();
  if (session) window.location.href = session.role === 'profissional' ? 'profissional.html' : 'cliente.html';
})();

const notes = {
  login: 'Não existe recuperação por e-mail aqui. Esqueceu a senha? Use a aba <strong>"Esqueci a senha"</strong> com o código que você guardou ao criar a conta.',
  signup: 'Ao criar a conta, você recebe um <strong>código de recuperação</strong> — anote e guarde em lugar seguro. É a única forma de trocar sua senha se esquecer.',
  recover: 'Cole aqui exatamente o código que apareceu quando você criou sua conta (ex: <code>AB3D-9F2K</code>). Ao redefinir, um novo código será gerado — o antigo deixa de funcionar.'
};

function toggleSignupAddressField(){
  const isClient = document.querySelector('input[name=signupRole]:checked').value === 'cliente';
  document.getElementById('signupAddressField').style.display = isClient ? 'block' : 'none';
}

function switchTab(tab){
  ['login','signup','recover'].forEach(t => {
    document.getElementById('tabBtn-' + t).classList.toggle('active', t === tab);
    document.getElementById(t + 'Form').style.display = t === tab ? 'block' : 'none';
  });
  document.getElementById('authNote').innerHTML = notes[tab];
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const user = await entrarComSenha(username, password);
    const password_hash = await sha256Hex(password);
    setSession({ id: user.id, username: user.username, name: user.name, role: user.role, password_hash, address: user.address });
    window.location.href = user.role === 'admin' ? 'admin.html' : user.role === 'profissional' ? 'profissional.html' : 'cliente.html';
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const name = document.getElementById('signupName').value.trim();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  const role = document.querySelector('input[name=signupRole]:checked').value;
  const address = document.getElementById('signupAddress').value.trim();

  btn.disabled = true; btn.textContent = 'Criando...';
  try {
    const { user, recovery_code } = await criarConta(name, username, password, role, address);
    alert('✅ Conta criada!\n\nGUARDE SEU CÓDIGO DE RECUPERAÇÃO:\n\n' + recovery_code + '\n\nVocê vai precisar dele se esquecer sua senha. Não existe outra forma de recuperar.');
    setSession({ id: user.id, username: user.username, name: user.name, role: user.role, address: user.address });
    window.location.href = user.role === 'profissional' ? 'profissional.html' : 'cliente.html';
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = 'Criar conta';
  }
});

document.getElementById('recoverForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const username = document.getElementById('recoverUsername').value.trim();
  const code = document.getElementById('recoverCode').value.trim();
  const newPassword = document.getElementById('recoverNewPassword').value;

  btn.disabled = true; btn.textContent = 'Redefinindo...';
  try {
    const newCode = await redefinirSenha(username, code, newPassword);
    alert('✅ Senha redefinida!\n\nSeu NOVO código de recuperação é:\n\n' + newCode + '\n\nGuarde-o — o código antigo não funciona mais.');
    document.getElementById('recoverForm').reset();
    switchTab('login');
  } catch (err) {
    alert(err.message);
  }
  btn.disabled = false; btn.textContent = 'Redefinir senha';
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(console.error);
}
if (typeof setupInstallAndNotifyBanner === 'function') setupInstallAndNotifyBanner();
</script>
</body>
</html>
