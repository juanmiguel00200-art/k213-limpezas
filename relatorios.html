<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K213 · Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="snackbar" class="snackbar"></div>

<div class="topbar">
  <div class="brand">
    <div class="mark"></div>
    <div><div class="name">K213</div><div class="sub">RELATÓRIOS</div></div>
  </div>
  <div class="who">
    <span class="sync-dot"><span class="dot"></span>SINCRONIZADO</span>
    <nav>
      <a href="profissional.html">Tarefas</a>
      <a href="relatorios.html" class="active">Relatórios</a>
    </nav>
    <span id="topWhoName"></span>
    <button class="btn btn-ghost" onclick="logout()">Sair</button>
  </div>
</div>

<div class="wrap">
  <div class="page-hero">
    <div class="eyebrow">KÖNIZSTRASSE 213 · LIEBEFELD</div>
    <h1>Relatórios</h1>
    <p class="lede">Histórico, tempo trabalhado e faturamento das limpezas concluídas.</p>
  </div>

  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-label">Histórico de limpezas concluídas</div>
  <div id="historyList"></div>
</div>

<script src="app-common.js"></script>
<script>
(async function init(){
  const ctx = await requireRole('profissional');
  if (!ctx) return;
  loadReports();
  startRealtime(() => loadReports());
})();

async function loadReports(){
  const grid = document.getElementById('statsGrid');
  const history = document.getElementById('historyList');

  // safe default for PRICE_BASE if not defined
  const basePrice = (typeof PRICE_BASE !== 'undefined') ? PRICE_BASE : 0;

  const { data: completed, error } = await supabase
    .from('cleaning_requests')
    .select('*')
    .eq('status', 'completed')
    .order('completed_at', { ascending: false });
  if (error) { history.innerHTML = '<div class="empty">Erro ao carregar: ' + escapeHtml(error.message) + '</div>'; return; }

  const total = (completed || []).length;
  let totalTime = 0, totalRevenue = 0, laundryCount = 0;
  (completed || []).forEach(r => {
    if (r && r.work_start && r.work_end) totalTime += (new Date(r.work_end) - new Date(r.work_start)) / 1000;
    totalRevenue += Number((r && r.price) != null ? r.price : basePrice) || 0;
    if (r && r.laundry_service) laundryCount++;
  });
  const avgTime = total > 0 ? totalTime / total : 0;

  grid.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Limpezas concluídas</div></div>
    <div class="stat"><div class="n">${formatDuration(totalTime)}</div><div class="l">Tempo total</div></div>
    <div class="stat"><div class="n">${formatDuration(avgTime)}</div><div class="l">Média por limpeza</div></div>
    <div class="stat"><div class="n">${Number(totalRevenue).toFixed(2)}</div><div class="l">Faturamento (CHF)</div></div>
    <div class="stat"><div class="n">${laundryCount}</div><div class="l">Com lavagem</div></div>
  `;

  if (!completed || !completed.length) { history.innerHTML = '<div class="empty">Nenhuma limpeza concluída ainda.</div>'; return; }

  history.innerHTML = (completed || []).map(r => {
    const price = Number((r && r.price) != null ? r.price : basePrice).toFixed(2) + ' CHF';
    const dateStr = formatDate(r && (r.completed_at || r.date));
    const addr = escapeHtml(r && r.address ? r.address : '');
    const client = escapeHtml(r && r.client_name ? r.client_name : '');
    const guestCount = (r && r.guest_count) != null ? r.guest_count : '-';
    const stay = (r && r.stay_duration) != null ? r.stay_duration : '-';
    const laundryLabel = r && r.laundry_service ? '· 🧺 com lavagem' : '';
    let timeLine = '';
    if (r && r.work_start && r.work_end) {
      const durSec = (new Date(r.work_end) - new Date(r.work_start)) / 1000;
      timeLine = `<div style="color:var(--success); margin-top:8px; font-size:13px; font-weight:600;">⏱️ Tempo: ${formatDuration(durSec)} — ${formatDate(r.work_start)} → ${formatDate(r.work_end)}</div>`;
    }
    return `
      <div class="task completed">
        <div class="task-top">
          <div>
            <div class="task-ref">${escapeHtml(r && r.ref_code ? r.ref_code : '')}</div>
            <div class="task-addr">${addr}</div>
          </div>
          <div class="task-badges">
            <span class="badge price ${r && r.laundry_service ? 'laundry' : ''}">${price}</span>
            <span style="font-family:var(--mono); font-size:12px; color:var(--muted);">${dateStr}</span>
          </div>
        </div>
        <div class="task-notes">Cliente: ${client} · Hóspedes: ${guestCount} · Estadia: ${stay} dias ${laundryLabel}</div>
        ${timeLine}
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
