<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanSync · Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15151A">
<link rel="stylesheet" href="style.css?v=10">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "6ece3179-2303-4614-a752-18378c461644",
      serviceWorkerPath: "onesignal/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/onesignal/" }
    });
  });
</script>
</head>
<body>

<div id="snackbar" class="snackbar"></div>

<div class="topbar">
  <div class="brand">
    <div class="mark"></div>
    <div><div class="name">CleanSync</div><div class="sub">RELATÓRIOS</div></div>
  </div>
  <div class="who">
    <span class="sync-dot"><span class="dot"></span>SINCRONIZADO</span>
    <nav>
      <a href="profissional.html">Tarefas</a>
      <a href="relatorios.html" class="active">Relatórios</a>
      <a href="admin.html" id="navAdminLink" style="display:none;">Usuários</a>
    </nav>
    <span id="topWhoName"></span>
    <button class="btn btn-ghost" onclick="logout()">Sair</button>
  </div>
</div>

<div class="wrap">
  <div class="page-hero">
    <div class="eyebrow">COORDENAÇÃO DE LIMPEZA</div>
    <h1>Relatórios</h1>
    <p class="lede">Histórico, tempo trabalhado e faturamento das limpezas concluídas.</p>
  </div>

  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-label">Histórico de limpezas concluídas</div>
  <div id="historyList"></div>
</div>

<script src="app-common.js?v=10"></script>
<script>
(async function init(){
  const ctx = await requireRole('profissional');
  if (!ctx) return;
  loadReports();
  startRealtime(() => loadReports());
})();

async function loadReports(){
  const grid = document.getElementById('statsGrid');
  const history = document.getElementById('historyList');

  const { data: completed, error } = await sb.from('cleaning_requests').select('*').eq('status', 'completed').order('completed_at', { ascending: false });
  if (error) { history.innerHTML = '<div class="empty">Erro ao carregar: ' + error.message + '</div>'; return; }

  const total = completed.length;
  let totalTime = 0, totalRevenue = 0, laundryCount = 0;
  completed.forEach(r => {
    if (r.work_start && r.work_end) totalTime += (new Date(r.work_end) - new Date(r.work_start)) / 1000;
    totalRevenue += Number(r.price || PRICE_BASE);
    if (r.laundry_service) laundryCount++;
  });
  const avgTime = total > 0 ? totalTime / total : 0;

  grid.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Limpezas concluídas</div></div>
    <div class="stat"><div class="n">${formatDuration(totalTime)}</div><div class="l">Tempo total</div></div>
    <div class="stat"><div class="n">${formatDuration(avgTime)}</div><div class="l">Média por limpeza</div></div>
    <div class="stat"><div class="n">${totalRevenue}</div><div class="l">Faturamento (CHF)</div></div>
    <div class="stat"><div class="n">${laundryCount}</div><div class="l">Com lavagem</div></div>
  `;

  if (!completed.length) { history.innerHTML = '<div class="empty">Nenhuma limpeza concluída ainda.</div>'; return; }

  history.innerHTML = completed.map(r => `
    <div class="task completed">
      <div class="task-top">
        <div><div class="task-ref">${r.ref_code || ''}</div><div class="task-addr">${escapeHtml(r.address)}</div></div>
        <div class="task-badges">
          <span class="badge price ${r.laundry_service ? 'laundry' : ''}">${r.price} CHF</span>
          <span style="font-family:var(--mono); font-size:12px; color:var(--muted);">${formatDate(r.date)}</span>
        </div>
      </div>
      <div class="task-notes">Cliente: ${escapeHtml(r.client_name)} · Hóspedes: ${r.guest_count} · Estadia: ${r.stay_duration} dias ${r.laundry_service ? '· 🧺 com lavagem' : ''}</div>
      ${r.work_start && r.work_end ? `<div style="color:var(--success); margin-top:8px; font-size:13px; font-weight:600;">⏱️ Tempo: ${formatDuration((new Date(r.work_end) - new Date(r.work_start)) / 1000)}</div>` : ''}
    </div>
  `).join('');
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(console.error);
}
if (typeof setupInstallAndNotifyBanner === 'function') setupInstallAndNotifyBanner();
</script>
</body>
</html>
